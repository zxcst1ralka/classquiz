<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Онлайн-тесты{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>.form-check-input{width:1.25em;height:1.25em}.form-check{padding-top:.2rem;padding-bottom:.2rem}</style>
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
      <a class="navbar-brand" href="{% url 'quiz:home' %}">Онлайн-тесты</a>
      {% if user.is_authenticated %}
      <div class="d-flex flex-wrap align-items-center gap-2">
        {% if user.is_staff %}
          <a class="btn btn-sm btn-outline-light" href="{% url 'quiz:results' %}">Результаты</a>
          <a class="btn btn-sm btn-outline-light" href="{% url 'admin:index' %}">Админка</a>
        {% else %}
          <a class="btn btn-sm btn-outline-light" href="{% url 'quiz:cabinet' %}">Мои задания</a>
        {% endif %}
        <form method="post" action="{% url 'logout' %}" class="m-0">
          {% csrf_token %}
          <button type="submit" class="btn btn-sm btn-light">Выйти</button>
        </form>
      </div>
      {% endif %}
    </div>
  </nav>

  <main class="container pb-5" style="max-width: {% block width %}760px{% endblock %};">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}">{{ message }}</div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
