<div class="card review {% if state == 'partial' %}is-partial{% elif state == 'wrong' %}is-wrong{% endif %}">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-start gap-3 mb-2">
      <div>
        <h2 class="mb-1">{{ a.question.text }}</h2>
        <span class="stamp {% if state == 'ok' %}stamp-done{% elif state == 'partial' %}stamp-late{% else %}stamp-debt{% endif %}">{{ label }}</span>
      </div>
      <span class="pts">{{ a.earned|floatformat:"-2" }} / {{ a.question.points }}</span>
    </div>
    <dl class="mb-0 mt-3">
      <dt>Ваш ответ:</dt>
      <dd>{{ a.given|linebreaksbr }}</dd>
      <dt>Правильный ответ:</dt>
      <dd>{{ a.correct_text|linebreaksbr }}</dd>
    </dl>
    {% if a.question.comment %}
      <div class="teacher-note">
        <b>Комментарий преподавателя:</b>{{ a.question.comment|linebreaksbr }}
      </div>
    {% endif %}
  </div>
</div>
