{% extends 'quiz/base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="card mx-auto" style="max-width: 420px;">
  <div class="card-body">
    <h1 class="h4 mb-3">Вход</h1>

    {% if form.errors %}
      <div class="alert alert-danger">Неверный логин или пароль. Попробуйте ещё раз.</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label" for="id_username">Логин</label>
        <input type="text" name="username" id="id_username" class="form-control"
               autofocus autocapitalize="none" autocomplete="username" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="id_password">Пароль</label>
        <input type="password" name="password" id="id_password" class="form-control"
               autocomplete="current-password" required>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-primary w-100">Войти</button>
    </form>
  </div>
</div>
{% endblock %}
